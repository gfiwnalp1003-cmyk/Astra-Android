
name: Build Astra APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          unzip -o Astra-Android-upload-ready.zip -d extracted

          PROJECT_SETTINGS=$(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          "$SDKMANAGER" --licenses < <(yes || true)

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Maven fallback
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/init.gradle" <<'GRADLE'
          allprojects {
              buildscript {
                  repositories {
                      maven {
                          name = "MavenCentralMirror"
                          url = uri("https://repo1.maven.org/maven2")
                      }
                  }
              }

              repositories {
                  maven {
                      name = "MavenCentralMirror"
                      url = uri("https://repo1.maven.org/maven2")
                  }
              }
          }
          GRADLE

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"

            if gradle assembleDebug \
              --no-daemon \
              --refresh-dependencies \
              --stacktrace; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed. Retrying..."
              sleep 15
            fi
          done

          echo "ERROR: Build failed after 3 attempts"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Astra-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
